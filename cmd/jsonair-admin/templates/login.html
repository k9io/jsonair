{{template "head" .}}
<body>
<main class="login">
  <div class="login-brand">
    <div class="login-mark">{{template "i-logo"}}</div>
    <h1>Sign in to JSONAir Admin</h1>
  </div>

  <form class="card login-card" method="POST" action="/login" data-login>
    {{if .Error}}
    <div class="flash flash-error" role="alert">{{template "i-alert"}}<span>{{.Error}}</span></div>
    {{else if .Expired}}
    <div class="flash flash-info" role="status">{{template "i-alert"}}<span>Your session has expired. Sign in again to continue.</span></div>
    {{end}}

    <div class="form-field">
      <label for="l-user" class="lbl">Username</label>
      <input id="l-user" class="field field-lg" type="text" name="username" value="{{.Username}}" required autocomplete="username" autocapitalize="off" spellcheck="false"{{if not .Username}} autofocus{{end}}{{if .Error}} aria-invalid="true"{{end}}>
    </div>

    <div class="form-field">
      <label for="l-pass" class="lbl">Password</label>
      <input id="l-pass" class="field field-lg" type="password" name="password" required autocomplete="current-password"{{if .Username}} autofocus{{end}}{{if .Error}} aria-invalid="true"{{end}}>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in</button>
  </form>

  <p class="login-foot">Sessions last 4 hours.</p>
</main>
</body>
</html>
