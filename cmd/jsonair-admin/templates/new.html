{{template "head" .}}
<body>
{{template "nav" .}}
<main class="page page-narrow page-with-actionbar">

  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="/configs">Configurations</a>
    {{template "i-chevron"}}<span aria-current="page">New</span>
  </nav>

  <div class="title-row">
    <h1>New configuration</h1>
  </div>
  <p class="subtitle">A configuration is unique per key, type and name.</p>

  {{template "flash" .}}

  <form id="config-form" class="stack" method="POST" action="/configs/new" data-track-changes{{if .StartDirty}} data-start-dirty{{end}}>
    {{template "csrf" .}}
    {{template "config-fields" .}}
  </form>
</main>

<div class="actionbar">
  <div class="actionbar-inner">
    <span class="actionbar-spacer"></span>
    <span class="dirty-indicator" data-dirty-indicator hidden>Unsaved changes</span>
    <a class="btn btn-secondary" href="/configs">Cancel</a>
    <button type="submit" form="config-form" class="btn btn-primary"{{if not .Keys}} disabled{{end}}>Create configuration</button>
  </div>
</div>
</body>
</html>
